<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 작업 게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== 스타일 =====
   [색상] 아래 변수만 바꾸면 사이트 전체 색이 바뀌어요. 이 블록은 밝은 테마 기본값이에요. */
:root{--bg:#eceff3;--paper:#fff;--ink:#1a2132;--mute:#65708a;--line:#d5dae4;--acc:#2f4bff;--acc-ink:#fff;--hi:#ffe45e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* [어두운 테마] 시스템이 다크 모드일 때(자동) + 버튼으로 직접 어둡게 고른 경우 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--paper:#1a1f2b;--ink:#e8ebf3;--mute:#98a2bb;--line:#2b3244;--acc:#7f93ff;--acc-ink:#11141b;--hi:#8a7a1c}}
:root[data-theme="dark"]{--bg:#11141b;--paper:#1a1f2b;--ink:#e8ebf3;--mute:#98a2bb;--line:#2b3244;--acc:#7f93ff;--acc-ink:#11141b;--hi:#8a7a1c}
/* [기본] 모든 요소의 크기 계산 방식, 글꼴, 버튼 기본 모양, 키보드 포커스 표시 */
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "IBM Plex Sans KR",system-ui,sans-serif}
h1,h2{font-family:"Gowun Batang",Georgia,serif;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* [레이아웃] 왼쪽 프로필(.side) + 오른쪽 본문(.main) 2단 구성 */
.wrap{max-width:1120px;margin:0 auto;padding:20px;display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:20px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px}
.avatar{display:block;width:96px;height:96px;border-radius:50%;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:var(--bg)}
.avatar svg,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.editing .avatar{cursor:pointer;outline:2px dashed var(--acc);outline-offset:2px}
.side h1{font-size:26px}
.role{color:var(--mute);margin:2px 0 14px}
.side p{margin:0}
[contenteditable="true"]{outline:1px dashed var(--acc);outline-offset:2px;border-radius:3px;min-height:1.4em}
.side dl{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;border-top:1px solid var(--line);padding-top:14px}
/* [프로필 링크] 링크가 걸린 항목은 강조색, 편집 모드의 🔗 버튼은 링크가 있으면 강조색 */
.side dd a{color:var(--acc);text-underline-offset:2px}
.mini.on{color:var(--acc)}
.side dt{color:var(--mute)}.side dd{margin:0;min-width:0;overflow-wrap:anywhere}
.hint{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.theme{margin-top:10px;background:none;border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;font-size:13px}
.adm{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.main{min-width:0}
/* [메인 탭] .nav 탭 줄, .nv 탭 버튼, .nw 탭 버튼 + 편집용 작은 버튼 묶음 */
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.nv{background:none;border:0;border-bottom:3px solid transparent;padding:8px 16px;cursor:pointer;font-size:16px;font-weight:500;color:var(--mute);margin-bottom:-1px}
.nv[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.nav{flex-wrap:wrap}.nw{display:inline-flex;align-items:center;margin-bottom:-1px}.nav>.btn{align-self:center;margin:0 0 4px 6px}
/* [자유 글 페이지] 본문(.pg)은 줄바꿈을 입력한 그대로 보여 줘요 */
.pg{white-space:pre-wrap;margin:14px 0 0}
/* [글 작성 도구] 글자 크기·색 도구 막대(.fbar)와 서식 미리보기(.fpv) */
.rich{display:block;margin:0 0 12px;font-size:14px;color:var(--mute)}
.rich .rl{display:block;margin-bottom:4px}
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
form.add .fbar select{width:auto;padding:4px 6px}
.fbar .sw{display:flex;gap:4px}
.fbar .sw button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);padding:0;cursor:pointer}
form.add .fbar input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);background:none;cursor:pointer}
.rich .fh.warn{color:#c0392b}
.fpv{margin-top:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:4px;max-height:180px;overflow:auto;white-space:pre-wrap;color:var(--ink)}
.fpv .pgimg{max-height:140px;width:auto}
/* [페이지 사진] 본문 속 사진(.pgimg), 편집창의 사진 썸네일 목록(.pgpv) */
.pgimg{display:block;max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line);margin:12px 0}
.pgpv{display:flex;flex-wrap:wrap;gap:8px}
.pgpv figure{margin:0;width:84px;font-size:12px;color:var(--mute);text-align:center}
.pgpv img{display:block;width:84px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.pgpv button{border:0;background:none;color:#c0392b;cursor:pointer;font-size:12px;padding:2px}
/* [도구 줄 / 분류 탭 / 버튼] .bar 도구 줄, .tab 분류 알약, .mini 편집용 작은 버튼, .btn 일반 버튼 */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tw{display:inline-flex;align-items:center;gap:2px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:14px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mini{border:0;background:none;cursor:pointer;color:var(--mute);padding:2px 5px;font-size:14px;border-radius:4px}
.mini:hover{background:var(--hi);color:var(--ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 12px;cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:500}
.btn.dng{color:#c0392b}
.count{color:var(--mute);font-size:13.5px;margin:0 0 10px}
/* [작품 게시판] 갤러리 보기(.grid/.card) 와 게시판 보기(.list/.row) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;width:100%}
.card:hover{border-color:var(--acc)}
.thumb{aspect-ratio:4/3;background:var(--bg)}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{padding:10px 12px 12px}
.card b{display:block;font-weight:600}
.card small{color:var(--mute)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.row{display:grid;grid-template-columns:48px 1fr 100px 100px;gap:10px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);align-items:center;min-width:480px;width:100%;background:none;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row.h{cursor:default;color:var(--mute);font-size:13px;background:var(--bg)}
.row:not(.h):hover{background:color-mix(in srgb,var(--hi) 30%,transparent)}
.row span:first-child{text-align:center;color:var(--mute)}
.pill{display:inline-block;background:var(--hi);color:var(--ink);border-radius:3px;padding:0 7px;font-size:12.5px;font-style:normal}
.empty{padding:40px;text-align:center;color:var(--mute);background:var(--paper);border:1px dashed var(--line);border-radius:6px}
/* [공지사항] 제목을 누르면 펼쳐지는 목록(details) */
.notes{background:var(--paper);border:1px solid var(--line);border-radius:6px}
.notes details{border-bottom:1px solid var(--line)}
.notes details:last-child{border-bottom:0}
.notes summary{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.notes summary::-webkit-details-marker{display:none}
.notes summary:hover{background:color-mix(in srgb,var(--hi) 30%,transparent)}
.d{color:var(--mute);font-size:13px}
.tag{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;text-align:center;font-size:12.5px;border:1px solid var(--line);border-radius:3px;color:var(--mute)}
.tag.pin{background:var(--hi);color:var(--ink);border-color:transparent}
.nb{padding:4px 14px 16px 88px}
.nb p{margin:0;max-width:62ch;white-space:pre-wrap}
/* [안내 상자] 자유 글 페이지·비어 있는 상위 탭 등에서 쓰는 흰색 상자(.bk) */
.bk{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.bk h2{font-size:20px;margin-bottom:4px}
.bk dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:14px 0 18px}
.bk dt{color:var(--mute)}.bk dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bk label.ck{display:flex;gap:8px;align-items:center;margin:0 0 14px}
/* [팝업] 작품 상세 보기(#dlg), 입력 폼(#fm) 공통 모양 */
dialog{border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:0;max-width:min(680px,94vw);width:100%}
dialog::backdrop{background:rgba(10,14,24,.6)}
.dv{aspect-ratio:4/3;background:var(--bg)}.dv svg,.dv img{width:100%;height:100%;object-fit:contain;display:block}
.db{padding:18px 22px 22px}
.db h2{font-size:22px;margin-bottom:4px}
.meta{color:var(--mute);font-size:13.5px;margin-bottom:10px}
.db p{white-space:pre-wrap;margin:0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
/* [입력 폼] 팝업 안의 입력칸 모양 */
form.add{padding:22px;display:grid;gap:12px}
form.add p{margin:0}
form.add label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
form.add label.ck{display:flex;gap:8px;align-items:center;color:var(--ink)}
form.add input:not([type=checkbox]),form.add select,form.add textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:var(--ink);width:100%}
/* [알림] 화면 아래에 잠깐 뜨는 안내 문구 */
#msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:9;max-width:90vw}
/* [반응형] 좁은 화면(모바일)에서는 프로필과 본문을 위아래 1단으로 */
@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:14px}.side{position:static}.nb{padding-left:14px}}
/* [애니메이션] 사용자가 "움직임 줄이기"를 켜지 않았을 때만 팝업이 부드럽게 나타나요 */
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<!-- ===== 화면 뼈대: 왼쪽 프로필(aside) + 오른쪽 본문(main). 내용은 아래의 자바스크립트가 채워 넣어요 ===== -->
<div class="wrap" id="wrap">
  <!-- 왼쪽: 프로필. 편집 모드에서는 글자를 직접 고치고, 사진을 눌러 바꿀 수 있어요 -->
  <aside class="side">
    <label class="avatar" id="avL"><input type="file" id="avIn" accept="image/*" hidden><span id="av"></span></label>
    <h1 id="pName" data-k="name"></h1>
    <p class="role" id="pRole" data-k="role"></p>
    <p id="pBio" data-k="bio"></p>
    <dl id="pDl"></dl>
    <!-- 관리자 전용 버튼 (로그인하면 나타남) -->
    <div class="adm" id="adm" hidden>
      <button class="btn pri" id="editT" type="button"></button>
      <button class="btn" id="logoutB" type="button">로그아웃</button>
      <p class="hint" id="admHint"></p>
    </div>
    <button class="theme" id="theme" type="button">화면 모드 바꾸기</button>
    <button class="theme" id="loginB" type="button" style="margin-left:6px">관리자 로그인</button>
  </aside>

  <!-- 오른쪽: 본문. 선택한 탭의 형식에 따라 아래 영역(pagePane / noticePane / worksPane) 중 하나만 보여요 -->
  <main class="main">
    <!-- 메인 탭 줄 -->
    <div class="nav" role="tablist" id="nav"></div>
    <!-- 하위 글 탭 줄: 상위 탭을 골랐을 때만 나타남 -->
    <div class="tabs" id="subNav" role="group" aria-label="하위 탭" style="margin-bottom:14px" hidden></div>
    <!-- 자유 글 페이지 / 글 탭이 없는 상위 탭 -->
    <section id="pagePane" hidden></section>
    <!-- 공지사항 형식 탭 -->
    <section id="noticePane">
      <div class="bar"><p class="count" id="nCount" style="margin:0"></p><div class="tools"><button class="btn pri" type="button" data-nadd="1" id="nAdd" hidden>공지 쓰기</button></div></div>
      <div class="tabs" id="nTabs" role="group" aria-label="공지 분류" style="margin-bottom:12px"></div>
      <div class="notes" id="notes"></div>
    </section>
    <!-- 작품 게시판 형식 탭 -->
    <section id="worksPane" hidden>
      <div class="bar">
        <div class="tabs" id="tabs" role="group" aria-label="분류"></div>
        <div class="tools">
          <button class="btn" id="vGrid" type="button">갤러리</button>
          <button class="btn" id="vList" type="button">게시판</button>
          <button class="btn pri" type="button" data-wadd="1" id="wAdd" hidden>작품 올리기</button>
        </div>
      </div>
      <p class="count" id="count"></p>
      <div id="out"></div>
    </section>
  </main>
</div>

<!-- 팝업: #dlg 작품 상세 보기 / #fm 입력 폼 / #msg 알림 문구 -->
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<dialog id="fm"><form class="add" id="fmF" onsubmit="return false"></form></dialog>
<div id="msg" hidden></div>

<script>
/* ==========================================================================
   전체 구조 (읽는 순서 안내)
   1) 데이터   변수 S 하나에 사이트 내용이 전부 들어 있고, 저장하면 이 S 가 data.json 이 돼요.
               S.profile 프로필 / S.tabs 메인 탭 목록 (type: notice 공지 · works 작품 게시판 · page 자유 글 · group 상위 탭)
               기본 탭 2개(n, w)의 내용은 S.notices·S.ncats / S.works·S.cats 에,
               새로 만든 탭의 내용은 그 탭 객체 안에 들어 있어요. (현재 탭의 보관소는 H() 가 알려 줘요)
   2) 흐름     무언가 고치면 → commit() → renderAll() 로 화면을 다시 그리고 + save() 로 GitHub 에 저장
   3) 화면     renderAll() 이 현재 탭의 형식에 맞게 rNav / rSub / rProfile / rNotices / rWorks / rPage 를 호출
   4) 입력     form() 이 범용 입력 팝업. 글 작성 도구(서식)는 richHtml()·wireFmt()·fmt()
   5) 클릭     맨 아래 click 이벤트 한 곳에서 버튼의 data-속성으로 동작을 구분해요
   ========================================================================== */
// 자주 쓰는 도구: $ 요소 찾기 / esc 글자를 HTML 에 안전하게 넣기 / uid 새 id / today 오늘 날짜
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toISOString().slice(0,10);
// 같은 씨앗 값이면 항상 같은 난수를 만드는 함수 (자동 그림이 새로고침해도 똑같이 나오게)
function rnd(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
// 문자열을 숫자 하나로 바꿔요 (작품 id → 그림 모양 씨앗)
function hs(t){let h=7;for(const c of String(t))h=(h*31+c.charCodeAt(0))%100000;return h}
// 이미지가 없는 작품에 대신 보여 줄 자동 그림(SVG) 만들기
function art(seed,hue){
  const r=rnd(seed+3);let o=`<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="300" fill="hsl(${hue},45%,88%)"/>`;
  for(let i=0;i<7;i++){const h=(hue+r()*70-20+360)%360,x=r()*400,y=r()*300,s=30+r()*90;
    o+=r()>.45?`<circle cx="${x|0}" cy="${y|0}" r="${s|0}" fill="hsl(${h},${50+r()*30|0}%,${45+r()*30|0}%)" opacity=".8"/>`:`<rect x="${x|0}" y="${y|0}" width="${s*1.4|0}" height="${s|0}" rx="${r()*20|0}" fill="hsl(${h},${50+r()*30|0}%,${40+r()*35|0}%)" opacity=".75"/>`}
  return o+`<path d="M0 ${220+r()*40|0} Q 200 ${150+r()*60|0} 400 ${230+r()*40|0} V300 H0Z" fill="hsl(${hue},35%,25%)" opacity=".55"/></svg>`}

/* ---------- 기본 데이터 (게시 후에는 저장된 데이터가 우선) ---------- */
// 처음 열었을 때(저장된 data.json 이 없을 때) 보여 줄 예시 데이터. 사이트 데이터의 기본 모양이기도 해요.
function seed(){
  const cats=["일러스트","드로잉","수채","디지털"].map((n,i)=>({id:"c"+i,name:n}));
  const ci=[0,1,2,3,1,0,2,3];

const DATA_PATH="data.json",API="https://api.github.com";

// 사이트 주소(아이디.github.io/저장소)에서 GitHub 아이디와 저장소 이름을 추측해 로그인 창에 미리 채워 줘요
function guessRepo(){const h=location.hostname,p=location.pathname.split("/").filter(Boolean);
  if(h.endsWith(".github.io"))return{owner:h.split(".")[0],repo:p[0]&&!/\.html?$/.test(p[0])?p[0]:h};
  return{owner:"",repo:""}}
// GitHub API 요청에 공통으로 붙는 헤더 / data.json 파일 주소 / 브랜치 지정 문구
const hdr=x=>Object.assign({"Authorization":"Bearer "+gh.token,"X-GitHub-Api-Version":"2022-11-28"},x||{});
const fileUrl=()=>`${API}/repos/${gh.owner}/${gh.repo}/contents/${DATA_PATH}`;
const refQ=()=>gh.branch?`?ref=${encodeURIComponent(gh.branch)}`:"";
// 한글이 섞인 글자를 base64 로 바꿔요 (GitHub 업로드 형식)
function b64(t){const u=new TextEncoder().encode(t);let b="";for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)}
// 로그인 정보 보관: "로그인 유지"를 켜면 localStorage(계속), 아니면 sessionStorage(탭을 닫을 때까지)
function cfgGet(){try{return JSON.parse(localStorage.getItem("gh")||sessionStorage.getItem("gh")||"null")}catch(e){return null}}
function cfgSet(c,keep){try{localStorage.removeItem("gh");sessionStorage.removeItem("gh");(keep?localStorage:sessionStorage).setItem("gh",JSON.stringify(c))}catch(e){}}
function cfgClear(){try{localStorage.removeItem("gh");sessionStorage.removeItem("gh")}catch(e){}}
// 불러온 data.json 을 S 에 적용: 빠진 항목은 기본값으로 채우고, 탭·분류는 정리해요
function applyData(d){
  S=Object.assign(seed(),d);fixTabs();S.ncats=cleanNc(S.ncats);
  if(!S.profile||typeof S.profile!=="object")S.profile=seed().profile;
  S.profile.links=cleanLinks(S.profile.links)}
// 토큰으로 이 저장소에 쓰기 권한이 있는지 확인
async function verify(c){
  const r=await fetch(`${API}/repos/${c.owner}/${c.repo}`,{headers:{"Authorization":"Bearer "+c.token,"X-GitHub-Api-Version":"2022-11-28"}});
  if(!r.ok)return false;const j=await r.json();return !!(j.permissions&&(j.permissions.push||j.permissions.admin))}
// 저장소의 data.json 읽기 (파일이 아직 없으면 null)
async function ghLoad(){
  const r=await fetch(fileUrl()+refQ(),{headers:hdr(),cache:"no-store"});
  if(r.status===404){sha=null;return null}
  if(!r.ok)throw new Error("load "+r.status);
  sha=(await r.json()).sha;
  const raw=await fetch(fileUrl()+refQ(),{headers:hdr({"Accept":"application/vnd.github.raw+json"}),cache:"no-store"});
  if(!raw.ok)throw new Error("raw "+raw.status);
  return JSON.parse(await raw.text())}
// 저장소의 data.json 에 S 를 저장(커밋). 그 사이 다른 곳에서 바뀌었으면(409/422) 한 번 다시 불러와서 재시도해요
async function ghSave(retry){
  const body={message:"공지·게시판 내용 업데이트",content:b64(JSON.stringify(S))};
  if(sha)body.sha=sha;if(gh.branch)body.branch=gh.branch;
  const r=await fetch(fileUrl(),{method:"PUT",headers:hdr({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  if((r.status===409||r.status===422)&&!retry){await ghLoad();return ghSave(true)}
  if([401,403,404].includes(r.status))throw Object.assign(new Error("auth"),{code:"auth"});
  if(!r.ok)throw new Error("save "+r.status);
  sha=(await r.json()).content.sha}

async function shrink(file,max){
  const b=await createImageBitmap(file),k=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement("canvas");
  c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);

// 안전한 주소만 통과: http, https, mailto 만 허용 (javascript: 같은 주소는 거부)
function safeUrl(v){try{const u=new URL(String(v).trim());return["http:","https:","mailto:"].includes(u.protocol)&&u.href.length<=300?u.href:""}catch(e){return""}}
// 글자 내용으로 자동 주소 만들기 (없으면 "")
function autoLink(k,t){t=String(t||"").trim();
  if(k==="tool"&&/^@\w{1,15}$/.test(t))return"https://x.com/"+t.slice(1);
  if(k==="mail"&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t))return"mailto:"+t;
  return""}
// 입력한 글자를 주소로 다듬기: @아이디 / 이메일 / 주소 앞의 https:// 생략을 도와줘요. 올바르지 않으면 ""
function normLink(k,u){u=String(u||"").trim();if(!u)return"";
  if(k==="tool"&&/^@?\w{1,15}$/.test(u))return"https://x.com/"+u.replace(/^@/,"");
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u))return"mailto:"+u;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u="https://"+u;
  return safeUrl(u)}

function cleanLinks(o){const r={};if(!o||typeof o!=="object")return r;for(const[k]of LBL){const u=typeof o[k]==="string"?safeUrl(o[k]):"";if(u)r[k]=u}return r}

/* ---------- 메인 탭 편집 (이름 수정 · 순서 · 추가 · 삭제) ---------- */
const BT={n:"notice",w:"works"};                        // 기본 탭 2개 (삭제 불가, 이름·순서는 변경 가능)
// 탭 형식: page 자유 글 페이지 / notice 공지사항 / works 작품 게시판 / group 상위 탭(자유 글 페이지를 묶는 탭)
const TT=["page","notice","works","group"];
// ---- 저장된 데이터 검증 도구: 불러온 데이터를 그대로 믿지 않고 모양·길이·허용 문자를 확인해요
// cleanArr 목록 정리(유효한 id 만, 중복 제거) / cleanDate 날짜 / cleanImg 이미지(data URL 만 허용) / cleanPageImgs 페이지 사진
const cleanArr=(a,fn)=>{const seen=new Set();return(Array.isArray(a)?a:[]).filter(x=>x&&typeof x==="object"&&ID_RE.test(x.id)&&!seen.has(x.id)&&seen.add(x.id)).map(fn)};
const cleanDate=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:today();
const cleanImg=v=>typeof v==="string"&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(v)?v:null;
function cleanPageImgs(o){const r={};if(!o||typeof o!=="object")return r;let n=0;for(const k of Object.keys(o)){if(n>=PG_MAX)break;if(!/^\d{1,3}$/.test(k))continue;const v=cleanImg(o[k]);if(v){r[k]=v;n++}}return r}
// (cleanPageImgs 에서 사용)
const PG_MAX=12;                                          // 페이지 하나에 넣을 수 있는 사진 수
// 탭 목록 정리: 형식별로 허용된 항목만 남기고, 없는 상위 탭을 가리키는 글 탭은 일반 탭으로 바꾸고, 빠진 기본 탭은 복구해요
function cleanTabs(a){
  const seen=new Set(),out=[];
  for(const t of Array.isArray(a)?a:[]){
    if(!t||typeof t!=="object"||!ID_RE.test(t.id)||t.id==="b"||seen.has(t.id))continue;   // 예전 백업 탭(b)은 버림
   seen.add(t.id);
    const b=Object.hasOwn(BT,t.id);
    const name=cs(t.name,30)||"탭";
    if(b){out.push({id:t.id,name,type:BT[t.id]});continue}
    const ty=TT.includes(t.type)?t.type:"page";
    if(ty==="notice"){
      const ncats=cleanNc(t.ncats);
      out.push({id:t.id,name,type:ty,ncats,notices:cleanArr(t.notices,n=>({id:n.id,pin:!!n.pin,title:cs(n.title,80)||"제목 없음",date:cleanDate(n.date),cat:ncats.some(c=>c.id===n.cat)?n.cat:"",body:cs(n.body,5000)}))});
    }else if(ty==="works"){
      let cats=cleanNc(t.cats);if(!cats.length)cats=[{id:uid(),name:"작품"}];
      out.push({id:t.id,name,type:ty,cats,works:cleanArr(t.works,w=>({id:w.id,title:cs(w.title,80)||"제목 없음",cat:cats.some(c=>c.id===w.cat)?w.cat:cats[0].id,date:cleanDate(w.date),desc:cs(w.desc,5000),hue:Number.isFinite(w.hue)?w.hue:hs(w.id)%360,img:cleanImg(w.img)}))});
    }else if(ty==="group")out.push({id:t.id,name,type:"group"});
    else out.push({id:t.id,name,type:"page",body:cs(t.body,5000),imgs:cleanPageImgs(t.imgs),parent:cs(t.parent,40)});
  }
  const gids=new Set(out.filter(t=>t.type==="group").map(t=>t.id));
  for(const t of out)if(t.type==="page"&&!(t.parent&&gids.has(t.parent)))delete t.parent;   // 없는 상위 탭을 가리키면 일반 탭으로
  for(const d of seed().tabs)if(!seen.has(d.id))out.push(d);   // 빠진 기본 탭은 복구
  return out}

// ---- 글자 서식 (크기·색) ----
// 글에는 [크기=20]글자[/크기], [색=#e03131]글자[/색] 같은 표시가 들어가요. 겹쳐 쓸 수 있고, 사진은 [사진1] 로 넣어요.
// 보여 줄 때 fmt() 가 이 표시를 HTML 로 바꾸고, 작성할 때는 richHtml()/wireFmt() 의 도구 막대가 표시를 대신 넣어 줘요.
/* 글자 서식: [크기=20]글자[/크기], [색=#e03131]글자[/색] (겹쳐 쓸 수 있음), [사진1] */
function fmt(text,imgs){
  text=String(text??"");
  // 1단계: 글을 [서식 시작 / 서식 끝 / 사진 / 일반 글] 조각으로 나눠요
  const re=/\[(크기|색)=([^\]\s]{1,12})\]|\[\/(크기|색)\]|\[사진(\d+)\]/g,parts=[];let last=0,m;
  while((m=re.exec(text))){
    if(m.index>last)parts.push({t:"x",v:text.slice(last,m.index)});
    if(m[1])parts.push({t:"o",k:m[1],v:m[2]});else if(m[3])parts.push({t:"c",k:m[3]});else parts.push({t:"i",n:m[4]});
    last=re.lastIndex}
  if(last<text.length)parts.push({t:"x",v:text.slice(last)});
  // (사진 바로 앞뒤의 줄바꿈은 한 번씩 지워서 사진과 글 사이가 너무 벌어지지 않게 해요)
  parts.forEach((p,i)=>{if(p.t!=="i")return;                      // 사진 앞뒤의 줄바꿈 한 번씩 정리
    for(let j=i-1;j>=0;j--){if(parts[j].t==="x"){parts[j].v=parts[j].v.replace(/\n$/,"");break}if(parts[j].t==="i")break}
    for(let j=i+1;j<parts.length;j++){if(parts[j].t==="x"){parts[j].v=parts[j].v.replace(/^\n/,"");break}if(parts[j].t==="i")break}});
  // 2단계: 조각을 순서대로 HTML 로. 허용된 값(숫자 크기 10~60, #rrggbb 색)만 style 로 만들고, 글은 esc 로 안전하게 넣어요
  // 서식이 엇갈리게 닫히거나 안 닫혀도 화면이 깨지지 않게 정리해요
  const style=(k,v)=>k==="크기"?(/^\d{1,2}$/.test(v)?`font-size:${Math.min(60,Math.max(10,+v))}px`:""):(/^#[0-9a-fA-F]{6}$/.test(v)?`color:${v}`:"");
  const op=e=>e.s?`<span style="${e.s}">`:"",cl=e=>e.s?"</span>":"";
  let out="",st=[];
  for(const p of parts){
    if(p.t==="x")out+=esc(p.v);
    else if(p.t==="o"){const e={k:p.k,s:style(p.k,p.v)};st.push(e);out+=op(e)}
    else if(p.t==="c"){const i=st.map(e=>e.k).lastIndexOf(p.k);if(i<0)continue;
      const above=st.splice(i);out+=above.slice().reverse().map(cl).join("");
      above.slice(1).forEach(e=>{st.push(e);out+=op(e)})}
    else{const src=imgs&&imgs[p.n];if(!src)continue;
      out+=st.slice().reverse().map(cl).join("")+`<img class="pgimg" src="${esc(src)}" alt="사진 ${p.n}">`+st.map(op).join("")}}
  return out+st.slice().reverse().map(cl).join("");
}
// 색상 버튼 8개: [색 코드, 이름]
const SW=[["#e03131","빨강"],["#f76707","주황"],["#f59f00","노랑"],["#2f9e44","초록"],["#1c7ed6","파랑"],["#7048e8","보라"],["#d6336c","분홍"],["#868e96","회색"]];
const RICH_HINT="먼저 글자를 드래그해 선택한 뒤, 크기나 색을 고르세요.";
// 서식 도구 막대 + 입력창 + 미리보기 영역의 HTML 만들기 (form() 의 rich 칸, 글 페이지 편집창에서 사용)
function richHtml(id,label,rows){
  return `<div class="rich"><span class="rl">${esc(label)}</span><div class="fbar"><select class="fsz" aria-label="글자 크기"><option value="">글자 크기</option><option value="13">작게</option><option value="20">크게</option><option value="28">아주 크게</option><option value="36">특대</option></select><span class="sw">${SW.map(c=>`<button type="button" data-c="${c[0]}" style="background:${c[0]}" title="${c[1]}" aria-label="글자색 ${c[1]}"></button>`).join("")}</span><input type="color" class="fcol" value="#e03131" title="직접 고른 색" aria-label="글자색 직접 고르기"><button type="button" class="mini fclr" title="선택한 글자의 크기·색 서식 지우기">서식 지우기</button></div><p class="hint fh">${RICH_HINT}</p><textarea id="${id}" rows="${rows}" maxlength="5000"></textarea><div class="fpv" aria-live="polite"></div></div>`}
// richHtml 로 만든 영역에 동작 연결: 선택한 글자를 서식 표시로 감싸고 / 지우고, 입력할 때마다 미리보기 갱신
// getImgs: 미리보기에 보여 줄 사진 목록을 돌려주는 함수 (자유 글 페이지에서만 사용)
function wireFmt(root,getImgs){
  const ta=root.querySelector("textarea"),pv=root.querySelector(".fpv"),fh=root.querySelector(".fh");let ht;
  const refresh=()=>{pv.innerHTML=ta.value.trim()?fmt(ta.value,getImgs&&getImgs()):`<span class="hint">미리보기가 여기에 나와요.</span>`};
  const warn=()=>{fh.textContent="먼저 서식을 적용할 글자를 드래그해서 선택해 주세요.";fh.classList.add("warn");clearTimeout(ht);ht=setTimeout(()=>{fh.textContent=RICH_HINT;fh.classList.remove("warn")},3000)};
  const edit=fn=>{const a=ta.selectionStart,b=ta.selectionEnd;if(a===b){warn();return}
    const r=fn(ta.value.slice(a,b)),v=ta.value;ta.value=v.slice(0,a)+r+v.slice(b);ta.focus();ta.setSelectionRange(a,a+r.length);refresh()};
  const wrap=(o,c)=>edit(t=>o+t+c);
  root.querySelector(".fbar").addEventListener("mousedown",e=>{if(e.target.closest("button"))e.preventDefault()});   // 선택 영역 유지
  root.querySelector(".fsz").onchange=e=>{const v=e.target.value;e.target.value="";if(v)wrap(`[크기=${v}]`,"[/크기]")};
  root.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>wrap(`[색=${b.dataset.c}]`,"[/색]"));
  root.querySelector(".fcol").onchange=e=>wrap(`[색=${e.target.value}]`,"[/색]");
  root.querySelector(".fclr").onclick=()=>edit(t=>t.replace(/\[(크기|색)=[^\]\s]{1,12}\]|\[\/(크기|색)\]/g,""));
  ta.addEventListener("input",refresh);refresh();
}
// 자유 글 페이지 본문을 HTML 로 (서식과 사진 포함)
function pgHtml(t){return fmt(t.body,t.imgs)}
// 자유 글 페이지, 또는 글 탭이 없는 상위 탭의 안내 화면 그리기
function rPage(t){
  if(t.type==="group"){$("#pagePane").innerHTML=`<div class="bk"><h2>${esc(t.name)}</h2><p class="pg"><span class="hint">이 상위 탭에는 아직 글 탭이 없어요.${edit?" 위의 ‘+ 글 탭 추가’로 만들거나, 다른 자유 글 페이지 탭의 ‘묶기’로 이 탭에 넣어 보세요.":""}</span></p></div>`;return}
  if(t.type!=="page")return;
  $("#pagePane").innerHTML=`<div class="bk"><h2>${esc(t.name)}</h2><div class="pg">${t.body?pgHtml(t):`<span class="hint">아직 내용이 없어요.${edit?" 아래 ‘내용 수정’으로 써 보세요.":""}</span>`}</div>${edit?`<div class="acts"><button class="btn pri" type="button" data-pedit="${t.id}">내용 수정</button></div>`:""}</div>`;
}
// 탭 순서 바꾸기 (dir: -1 앞으로, 1 뒤로). 같은 묶음(형제) 안에서만 움직여요
function moveTab(id,dir){
  const a=S.tabs,t=a.find(x=>x.id===id);if(!t)return;
  const sib=a.filter(x=>(x.parent||"")===(t.parent||"")),i=sib.indexOf(t),j=i+dir;
  if(j<0||j>=sib.length)return;
  const ia=a.indexOf(sib[i]),ja=a.indexOf(sib[j]);[a[ia],a[ja]]=[a[ja],a[ia]];commit()}
// 탭 이름 수정
async function renTab(id){
  const t=S.tabs.find(x=>x.id===id);if(!t)return;
  const v=await form("탭 이름 수정",[{k:"n",l:"탭 이름",t:"text",v:t.name,req:1}]);
  if(!v)return;t.name=v.n.slice(0,30);commit();
}
// 탭 추가: 이름과 형식(공지 / 작품 게시판 / 자유 글 / 상위 탭)을 고르면 형식에 맞는 빈 탭을 만들어요
async function addTab(){
  const groups=S.tabs.filter(t=>t.type==="group");
  const v=await form("탭 추가",[{t:"msg",v:"새 탭의 형식을 골라 주세요."},{k:"n",l:"탭 이름",t:"text",req:1},{k:"type",l:"탭 형식",t:"select",v:"notice",o:[["notice","공지사항 형식 (공지 목록 · 분류 · 중요 고정)"],["works","작품 게시판 형식 (갤러리/게시판 · 분류)"],["page","자유 글 페이지 (글만 쓰는 탭)"],["group","상위 탭 (자유 글 페이지 여러 개를 묶는 탭)"]]},...(groups.length?[{k:"par",l:"자유 글 페이지일 때, 넣을 상위 탭",t:"select",v:"",o:[["","넣지 않음 (일반 탭)"],...groups.map(g=>[g.id,g.name])]}]:[])],"추가");
  if(!v)return;
  const base={id:uid(),name:v.n.slice(0,30)};
  const t=v.type==="notice"?{...base,type:"notice",ncats:[],notices:[]}
    :v.type==="works"?{...base,type:"works",cats:[{id:uid(),name:"작품"}],works:[]}
    :v.type==="group"?{...base,type:"group"}
    :{...base,type:"page",body:"",imgs:{},...(v.par?{parent:v.par}:{})};
  S.tabs.push(t);pane=t.id;cat="all";ncat="all";commit();
}
// 상위 탭 안에 자유 글 탭 바로 추가
async function addSub(gid){
  const v=await form("글 탭 추가",[{t:"msg",v:"이 상위 탭 안에 자유 글 페이지가 만들어져요."},{k:"n",l:"탭 이름",t:"text",req:1}],"추가");
  if(!v)return;const t={id:uid(),name:v.n.slice(0,30),type:"page",body:"",imgs:{},parent:gid};S.tabs.push(t);pane=t.id;commit();
}
// 자유 글 탭을 상위 탭에 넣기 / 다른 상위 탭으로 옮기기 / 묶음에서 빼기
async function setParent(id){
  const t=S.tabs.find(x=>x.id===id);if(!t||t.type!=="page")return;
  const groups=S.tabs.filter(x=>x.type==="group");
  if(!groups.length){msg("먼저 ‘+ 탭 추가’에서 ‘상위 탭’을 만들어 주세요.");return}
  const v=await form(`‘${t.name}’ 묶기`,[{k:"p",l:"넣을 상위 탭",t:"select",v:t.parent||"",o:[["","묶지 않음 (일반 탭)"],...groups.map(g=>[g.id,g.name])]}]);
  if(!v)return;if(v.p)t.parent=v.p;else delete t.parent;commit();
}
// 자유 글 페이지 편집 팝업: 서식 도구 + 사진 넣기. 사진은 글 속의 [사진N] 표시 자리에 나와요
// (저장할 때 글에서 표시가 사라진 사진은 함께 버려요)
async function editPage(id){
  const t=S.tabs.find(x=>x.id===id);if(!t)return;
  const imgs={...(t.imgs||{})};
  const d=$("#fm"),f=$("#fmF");
  f.innerHTML=`<h2>${esc(`‘${t.name}’ 내용 수정`)}</h2>${richHtml("pgT","내용",10)}<div><button type="button" class="btn" id="pgAdd">사진 넣기</button><input type="file" id="pgF" accept="image/*" multiple hidden></div><p class="hint">사진은 커서가 있던 자리에 [사진1] 처럼 들어가요. 이 표시를 옮기면 사진 위치가, 지우면 사진도 함께 빠져요.</p><div class="pgpv" id="pgPv"></div><div class="acts"><button type="button" class="btn" id="fX">취소</button><button type="button" class="btn pri" id="fOk">저장</button></div>`;
  const ta=$("#pgT");ta.value=t.body||"";wireFmt(ta.closest(".rich"),()=>imgs);
  const used=()=>new Set([...ta.value.matchAll(/\[사진(\d+)\]/g)].map(m=>m[1]).filter(k=>imgs[k]));
  const pv=()=>{$("#pgPv").innerHTML=[...used()].map(k=>`<figure><img src="${imgs[k]}" alt="사진 ${k}"><span>사진${k}</span><br><button type="button" data-k="${k}">빼기</button></figure>`).join("")};
  pv();ta.oninput=pv;
  $("#pgPv").onclick=e=>{const b=e.target.closest("button[data-k]");if(!b)return;const k=b.dataset.k;ta.value=ta.value.split(`[사진${k}]`).join("").replace(/\n{3,}/g,"\n\n");delete imgs[k];ta.dispatchEvent(new Event("input"))};
  $("#pgAdd").onclick=()=>$("#pgF").click();
  $("#pgF").onchange=async e=>{
    const fs=[...e.target.files];e.target.value="";
    for(const file of fs){
      if(used().size>=PG_MAX){msg(`사진은 한 페이지에 ${PG_MAX}장까지 넣을 수 있어요.`);break}
      try{
        const data=await shrink(file,960);
        let n=1;while(imgs[n])n++;imgs[n]=data;
        const pos=ta.selectionStart??ta.value.length,a=ta.value.slice(0,pos),b=ta.value.slice(pos);
        const tok=(a&&!a.endsWith("\n")?"\n":"")+`[사진${n}]`+(b.startsWith("\n")?"":"\n");
        ta.value=a+tok+b;ta.selectionStart=ta.selectionEnd=(a+tok).length;ta.dispatchEvent(new Event("input"))
      }catch(x){msg("이미지를 불러오지 못했어요.")}}
  };
  d.onclose=null;
  $("#fX").onclick=()=>d.close();
  $("#fOk").onclick=()=>{const keep=used(),out={};keep.forEach(k=>out[k]=imgs[k]);t.body=ta.value;t.imgs=out;d.close();commit()};
  d.showModal();
}
// 탭 삭제. 상위 탭을 지우면 안의 글 탭은 일반 탭으로 풀려요(삭제되지 않음)
async function delTab(id){
  const t=S.tabs.find(x=>x.id===id);if(!t||Object.hasOwn(BT,t.id))return;
  const n=S.tabs.filter(x=>x.parent===id).length;
  const v=await form("탭 삭제",[{t:"msg",v:t.type==="group"?(n?`‘${t.name}’ 상위 탭을 삭제하면 안에 있던 글 탭 ${n}개는 일반 탭으로 풀려요. (글 탭은 삭제되지 않아요) 삭제할까요?`:`‘${t.name}’ 상위 탭을 삭제할까요?`):`‘${t.name}’ 탭과 그 안의 내용이 모두 삭제돼요. 삭제할까요?`}],"삭제");
  if(!v)return;
  S.tabs.forEach(x=>{if(x.parent===id)delete x.parent});
  S.tabs=S.tabs.filter(x=>x.id!==id);
  if(pane===id)pane=(t.parent&&(S.tabs.find(x=>x.parent===t.parent)||S.tabs.find(x=>x.id===t.parent))||{id:"n"}).id;
  commit();
}
// 작품 상세 보기 팝업
function openWork(id){
  const w=H().works.find(x=>x.id===id);if(!w)return;
  $("#dlgBody").innerHTML=`<div class="dv">${th(w)}</div><div class="db"><h2>${esc(w.title)}</h2><div class="meta">${esc(catName(w.cat))} · ${esc(w.date)}</div><p>${w.desc?fmt(w.desc):"설명이 없어요."}</p><div class="acts">${edit?`<button class="btn dng" type="button" data-wdel="${w.id}">삭제</button><button class="btn" type="button" data-wed="${w.id}">수정</button>`:""}<button class="btn pri" type="button" id="cls">닫기</button></div></div>`;
  $("#dlg").showModal();
}

// 모든 버튼 클릭을 한곳에서 처리해요. 버튼의 data-속성 이름으로 동작을 구분해요
// 예: data-tab 탭 이동 / data-ned 공지 수정 / data-wdel 작품 삭제 / data-c 작품 분류 선택
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.tab||d.sub){let id=d.tab||d.sub;const g=S.tabs.find(x=>x.id===id);
    if(g&&g.type==="group")id=(S.tabs.find(x=>x.id===subs[id]&&x.parent===id)||S.tabs.find(x=>x.parent===id)||g).id;   // 상위 탭을 누르면 마지막에 보던(또는 첫) 글 탭
    if(id!==pane){cat="all";ncat="all"}pane=id;ss();renderAll()}
  else if(d.plink)setLink(d.plink);
  else if(d.nc){ncat=d.nc;ss();rNotices()}
  else if(d.naddc)addNCat();
  else if(d.nrenc)renNCat(d.nrenc);
  else if(d.ndelc)delNCat(d.ndelc);
  else if(d.tl)moveTab(d.tl,-1);
  else if(d.tr)moveTab(d.tr,1);
  else if(d.tren)renTab(d.tren);
  else if(d.tadd)addTab();
  else if(d.sadd)addSub(d.sadd);
  else if(d.tpar)setParent(d.tpar);
  else if(d.tdel)delTab(d.tdel);
  else if(d.pedit)editPage(d.pedit);
  else if(d.c){cat=d.c;ss();rWorks()}
  else if(d.id)openWork(d.id);
  else if(d.nadd)editNotice();
  else if(d.ned)editNotice(d.ned);
  else if(d.ndel)delItem("notices",d.ndel,"공지");
  else if(d.wadd)editWork();
  else if(d.wed)editWork(d.wed);
  else if(d.wdel)delItem("works",d.wdel,"작품");
  else if(d.addc)addCat();
  else if(d.ren)renCat(d.ren);
  else if(d.dc)delCat(d.dc);
  else if(t.id==="cls")$("#dlg").close();
  else if(t.id==="loginB")login();
  else if(t.id==="logoutB")logout();
});
// 작품 상세 팝업은 바깥 어두운 부분을 누르면 닫혀요
$("#dlg").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
// 상단 버튼: 갤러리/게시판 보기 전환, 편집 모드 켜고 끄기, 화면 모드(밝게/어둡게)
$("#vGrid").onclick=()=>{view="grid";ss();rWorks()};
$("#vList").onclick=()=>{view="list";ss();rWorks()};
$("#editT").onclick=()=>{edit=!edit;ss();renderAll()};
$("#theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
/* 프로필 글자 수정 */
document.addEventListener("focusout",e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k||!edit)return;const v=e.target.textContent.trim();if(v!==S.profile[k]){S.profile[k]=v;save()}});
// 프로필의 한 줄 항목은 Enter 로 입력을 마쳐요 (소개글은 줄바꿈 가능)
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.k&&e.target.id!=="pBio"){e.preventDefault();e.target.blur()}});
// 프로필 사진 바꾸기: 편집 모드에서만 가능하고, 240px 로 줄여서 저장해요
$("#avL").addEventListener("click",e=>{if(!edit)e.preventDefault()});
$("#avIn").onchange=async e=>{const f=e.target.files[0];if(!f||!edit)return;try{S.profile.avatar=await shrink(f,240);commit()}catch(x){msg("이미지를 불러오지 못했어요.")}};


const ID_RE=/^[\w-]{1,40}$/;                                                  // id는 영문·숫자·_·- 만 허용
const cs=(v,n)=>typeof v==="string"?v.slice(0,n):"";                         // 문자열만 통과, 길이 제한

// ---- 시작 ----
// 먼저 기본 데이터로 한 번 그린 뒤, 저장소의 data.json 을 불러오면 다시 그려요
renderAll();
(async()=>{
  /* 방문자 화면: 저장소의 data.json 을 불러옵니다 (없으면 기본 내용) */
  try{const r=await fetch(DATA_PATH+"?t="+Date.now(),{cache:"no-store"});if(r.ok)applyData(await r.json())}catch(e){}
  renderAll();
  /* 저장된 로그인이 있으면 자동으로 관리자 복구 */
  const c=cfgGet();
  if(c){try{if(await verify(c)){gh=c;admin=true;const d=await ghLoad();if(d)applyData(d)}else cfgClear()}catch(e){}}
  if(!admin)edit=false;
  renderAll();
})();
