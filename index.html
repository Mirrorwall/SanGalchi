<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 작업 게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--paper:#fff;--ink:#1a2132;--mute:#65708a;--line:#d5dae4;--acc:#2f4bff;--acc-ink:#fff;--hi:#ffe45e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--paper:#1a1f2b;--ink:#e8ebf3;--mute:#98a2bb;--line:#2b3244;--acc:#7f93ff;--acc-ink:#11141b;--hi:#8a7a1c}}
:root[data-theme="dark"]{--bg:#11141b;--paper:#1a1f2b;--ink:#e8ebf3;--mute:#98a2bb;--line:#2b3244;--acc:#7f93ff;--acc-ink:#11141b;--hi:#8a7a1c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "IBM Plex Sans KR",system-ui,sans-serif}
h1,h2{font-family:"Gowun Batang",Georgia,serif;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:20px;display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:20px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px}
.avatar{display:block;width:96px;height:96px;border-radius:50%;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:var(--bg)}
.avatar svg,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.editing .avatar{cursor:pointer;outline:2px dashed var(--acc);outline-offset:2px}
.side h1{font-size:26px}
.role{color:var(--mute);margin:2px 0 14px}
.side p{margin:0}
[contenteditable="true"]{outline:1px dashed var(--acc);outline-offset:2px;border-radius:3px;min-height:1.4em}
.side dl{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;border-top:1px solid var(--line);padding-top:14px}
.side dt{color:var(--mute)}.side dd{margin:0;min-width:0;overflow-wrap:anywhere}
.hint{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.theme{margin-top:10px;background:none;border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;font-size:13px}
.adm{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.main{min-width:0}
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.nv{background:none;border:0;border-bottom:3px solid transparent;padding:8px 16px;cursor:pointer;font-size:16px;font-weight:500;color:var(--mute);margin-bottom:-1px}
.nv[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.nav{flex-wrap:wrap}.nw{display:inline-flex;align-items:center;margin-bottom:-1px}.nav>.btn{align-self:center;margin:0 0 4px 6px}
.pg{white-space:pre-wrap;margin:14px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tw{display:inline-flex;align-items:center;gap:2px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:14px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mini{border:0;background:none;cursor:pointer;color:var(--mute);padding:2px 5px;font-size:14px;border-radius:4px}
.mini:hover{background:var(--hi);color:var(--ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 12px;cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:500}
.btn.dng{color:#c0392b}
.count{color:var(--mute);font-size:13.5px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;width:100%}
.card:hover{border-color:var(--acc)}
.thumb{aspect-ratio:4/3;background:var(--bg)}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{padding:10px 12px 12px}
.card b{display:block;font-weight:600}
.card small{color:var(--mute)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.row{display:grid;grid-template-columns:48px 1fr 100px 100px;gap:10px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);align-items:center;min-width:480px;width:100%;background:none;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row.h{cursor:default;color:var(--mute);font-size:13px;background:var(--bg)}
.row:not(.h):hover{background:color-mix(in srgb,var(--hi) 30%,transparent)}
.row span:first-child{text-align:center;color:var(--mute)}
.pill{display:inline-block;background:var(--hi);color:var(--ink);border-radius:3px;padding:0 7px;font-size:12.5px;font-style:normal}
.empty{padding:40px;text-align:center;color:var(--mute);background:var(--paper);border:1px dashed var(--line);border-radius:6px}
.notes{background:var(--paper);border:1px solid var(--line);border-radius:6px}
.notes details{border-bottom:1px solid var(--line)}
.notes details:last-child{border-bottom:0}
.notes summary{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.notes summary::-webkit-details-marker{display:none}
.notes summary:hover{background:color-mix(in srgb,var(--hi) 30%,transparent)}
.d{color:var(--mute);font-size:13px}
.tag{text-align:center;font-size:12.5px;border:1px solid var(--line);border-radius:3px;color:var(--mute)}
.tag.pin{background:var(--hi);color:var(--ink);border-color:transparent}
.nb{padding:4px 14px 16px 88px}
.nb p{margin:0;max-width:62ch;white-space:pre-wrap}
/* 프로필 백업 탭 */
.bk{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.bk h2{font-size:20px;margin-bottom:4px}
.bk dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:14px 0 18px}
.bk dt{color:var(--mute)}.bk dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bk label.ck{display:flex;gap:8px;align-items:center;margin:0 0 14px}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:0;max-width:min(680px,94vw);width:100%}
dialog::backdrop{background:rgba(10,14,24,.6)}
.dv{aspect-ratio:4/3;background:var(--bg)}.dv svg,.dv img{width:100%;height:100%;object-fit:contain;display:block}
.db{padding:18px 22px 22px}
.db h2{font-size:22px;margin-bottom:4px}
.meta{color:var(--mute);font-size:13.5px;margin-bottom:10px}
.db p{white-space:pre-wrap;margin:0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
form.add{padding:22px;display:grid;gap:12px}
form.add p{margin:0}
form.add label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
form.add label.ck{display:flex;gap:8px;align-items:center;color:var(--ink)}
form.add input:not([type=checkbox]),form.add select,form.add textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:var(--ink);width:100%}
#msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:9;max-width:90vw}
@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:14px}.side{position:static}.nb{padding-left:14px}}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <aside class="side">
    <label class="avatar" id="avL"><input type="file" id="avIn" accept="image/*" hidden><span id="av"></span></label>
    <h1 id="pName" data-k="name"></h1>
    <p class="role" id="pRole" data-k="role"></p>
    <p id="pBio" data-k="bio"></p>
    <dl id="pDl"></dl>
    <div class="adm" id="adm" hidden>
      <button class="btn pri" id="editT" type="button"></button>
      <button class="btn" id="logoutB" type="button">로그아웃</button>
      <p class="hint" id="admHint"></p>
    </div>
    <button class="theme" id="theme" type="button">화면 모드 바꾸기</button>
    <button class="theme" id="loginB" type="button" style="margin-left:6px">관리자 로그인</button>
  </aside>

  <main class="main">
    <div class="nav" role="tablist" id="nav"></div>
    <section id="pagePane" hidden></section>
    <section id="noticePane">
      <div class="bar"><p class="count" id="nCount" style="margin:0"></p><div class="tools"><button class="btn pri" type="button" data-nadd="1" id="nAdd" hidden>공지 쓰기</button></div></div>
      <div class="notes" id="notes"></div>
    </section>
    <!-- 프로필 백업 탭: 현재 프로필 요약 + 내려받기 / 복원 -->
    <section id="backupPane" hidden>
      <div class="bk">
        <h2>프로필 백업</h2>
        <p class="hint" style="margin:0">프로필을 파일로 보관해 두었다가, 실수로 지웠을 때 되돌릴 수 있어요.</p>
        <dl id="bkSum"></dl>
        <label class="ck"><input type="checkbox" id="bkAll"> 공지·작품·분류도 함께 백업</label>
        <div class="tools">
          <button class="btn pri" type="button" id="bkDl">백업 파일 내려받기</button>
          <button class="btn" type="button" id="bkUp">백업 파일로 복원</button>
          <input type="file" id="bkFile" accept="application/json,.json" hidden>
        </div>
      </div>
    </section>
    <section id="worksPane" hidden>
      <div class="bar">
        <div class="tabs" id="tabs" role="group" aria-label="분류"></div>
        <div class="tools">
          <button class="btn" id="vGrid" type="button">갤러리</button>
          <button class="btn" id="vList" type="button">게시판</button>
          <button class="btn pri" type="button" data-wadd="1" id="wAdd" hidden>작품 올리기</button>
        </div>
      </div>
      <p class="count" id="count"></p>
      <div id="out"></div>
    </section>
  </main>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<dialog id="fm"><form class="add" id="fmF" onsubmit="return false"></form></dialog>
<div id="msg" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toISOString().slice(0,10);
function rnd(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function hs(t){let h=7;for(const c of String(t))h=(h*31+c.charCodeAt(0))%100000;return h}
function art(seed,hue){
  const r=rnd(seed+3);let o=`<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="300" fill="hsl(${hue},45%,88%)"/>`;
  for(let i=0;i<7;i++){const h=(hue+r()*70-20+360)%360,x=r()*400,y=r()*300,s=30+r()*90;
    o+=r()>.45?`<circle cx="${x|0}" cy="${y|0}" r="${s|0}" fill="hsl(${h},${50+r()*30|0}%,${45+r()*30|0}%)" opacity=".8"/>`:`<rect x="${x|0}" y="${y|0}" width="${s*1.4|0}" height="${s|0}" rx="${r()*20|0}" fill="hsl(${h},${50+r()*30|0}%,${40+r()*35|0}%)" opacity=".75"/>`}
  return o+`<path d="M0 ${220+r()*40|0} Q 200 ${150+r()*60|0} 400 ${230+r()*40|0} V300 H0Z" fill="hsl(${hue},35%,25%)" opacity=".55"/></svg>`}

/* ---------- 기본 데이터 (게시 후에는 저장된 데이터가 우선) ---------- */
function seed(){
  const cats=["일러스트","드로잉","수채","디지털"].map((n,i)=>({id:"c"+i,name:n}));
  const ci=[0,1,2,3,1,0,2,3];
  const W=[["새벽의 창가","2026-09-28","창문에 번지는 새벽빛을 담은 작업.",210],["골목 고양이","2026-09-14","동네 골목에서 마주친 고양이를 펜으로 그렸어요.",30],["여름 끝자락","2026-08-30","물이 번지는 속도에 맞춰 칠한 풍경 수채화.",150],["밤 버스","2026-08-12","늦은 버스 안의 조용한 분위기를 색 면으로 표현했어요.",260],["정물 연습 3","2026-07-21","빛의 방향에 집중한 정물 연습.",45],["비 오는 날","2026-07-02","우산 아래 두 사람. 젖은 길의 반사광이 포인트예요.",190],["화분 스케치","2026-06-18","베란다 화분을 가볍게 담은 스케치.",110],["도시 조각","2026-05-27","도시의 건물 조각을 겹쳐 만든 추상 작업.",320]];
  return{
    profile:{name:"홍길동",role:"일러스트레이터 · 디지털 드로잉",bio:"일상의 작은 장면과 빛이 번지는 순간을 그립니다. 느리지만 꾸준하게 작업하는 것을 좋아해요.",loc:"경기도",tool:"Procreate, 수채, 펜",mail:"hello@example.com",ask:"일러스트, 표지, 굿즈",avatar:null},
    cats,
    tabs:[{id:"n",name:"공지사항",type:"notice"},{id:"b",name:"프로필 백업",type:"backup"},{id:"w",name:"작품 게시판",type:"works"}],
    works:W.map((w,i)=>({id:"w"+i,title:w[0],cat:"c"+ci[i],date:w[1],desc:w[2],hue:w[3],img:null})),
    notices:[
      {id:"n0",pin:true,title:"작업 문의 안내",date:"2026-10-05",body:"일러스트, 표지, 굿즈 작업 문의는 왼쪽 프로필의 이메일로 보내 주세요. 원하는 용도와 일정, 예산을 함께 적어 주시면 답변이 빨라요."},
      {id:"n1",pin:true,title:"게시판 이용 안내",date:"2026-10-01",body:"작품은 분류 탭으로 나눠 볼 수 있고, 갤러리와 게시판 보기를 바꿀 수 있어요. 작품 이미지는 허락 없이 사용할 수 없습니다."},
      {id:"n2",pin:false,title:"10월 신작 업데이트 예정",date:"2026-09-29",body:"이번 달에는 가을 풍경 시리즈를 올릴 예정이에요."},
      {id:"n3",pin:false,title:"사이트를 새로 열었어요",date:"2026-09-20",body:"프로필과 작품을 한곳에 모았습니다."}]};
}
let S=seed();
let ui={};try{ui=JSON.parse(sessionStorage.getItem("ui")||"{}")}catch(e){}
let admin=false,edit=!!ui.edit,pane=ui.pane||"n",cat=ui.cat||"all",view=ui.view||"grid";
if(cat!=="all"&&!S.cats.some(c=>c.id===cat))cat="all";
function ss(){try{sessionStorage.setItem("ui",JSON.stringify({edit,pane,cat,view}))}catch(e){}}

/* ---------- 알림 / 저장(게시) ---------- */
let mt;function msg(t){const m=$("#msg");m.textContent=t;m.hidden=false;clearTimeout(mt);mt=setTimeout(()=>m.hidden=true,3500)}
/* ---------- GitHub 연결 (data.json 을 저장소에 커밋) ---------- */
const DATA_PATH="data.json",API="https://api.github.com";
let gh=null,sha=null;
function guessRepo(){const h=location.hostname,p=location.pathname.split("/").filter(Boolean);
  if(h.endsWith(".github.io"))return{owner:h.split(".")[0],repo:p[0]&&!/\.html?$/.test(p[0])?p[0]:h};
  return{owner:"",repo:""}}
const hdr=x=>Object.assign({"Authorization":"Bearer "+gh.token,"X-GitHub-Api-Version":"2022-11-28"},x||{});
const fileUrl=()=>`${API}/repos/${gh.owner}/${gh.repo}/contents/${DATA_PATH}`;
const refQ=()=>gh.branch?`?ref=${encodeURIComponent(gh.branch)}`:"";
function b64(t){const u=new TextEncoder().encode(t);let b="";for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)}
function cfgGet(){try{return JSON.parse(localStorage.getItem("gh")||sessionStorage.getItem("gh")||"null")}catch(e){return null}}
function cfgSet(c,keep){try{localStorage.removeItem("gh");sessionStorage.removeItem("gh");(keep?localStorage:sessionStorage).setItem("gh",JSON.stringify(c))}catch(e){}}
function cfgClear(){try{localStorage.removeItem("gh");sessionStorage.removeItem("gh")}catch(e){}}
function applyData(d){S=Object.assign(seed(),d);fixTabs();if(cat!=="all"&&!S.cats.some(c=>c.id===cat))cat="all"}
async function verify(c){
  const r=await fetch(`${API}/repos/${c.owner}/${c.repo}`,{headers:{"Authorization":"Bearer "+c.token,"X-GitHub-Api-Version":"2022-11-28"}});
  if(!r.ok)return false;const j=await r.json();return !!(j.permissions&&(j.permissions.push||j.permissions.admin))}
async function ghLoad(){
  const r=await fetch(fileUrl()+refQ(),{headers:hdr(),cache:"no-store"});
  if(r.status===404){sha=null;return null}
  if(!r.ok)throw new Error("load "+r.status);
  sha=(await r.json()).sha;
  const raw=await fetch(fileUrl()+refQ(),{headers:hdr({"Accept":"application/vnd.github.raw+json"}),cache:"no-store"});
  if(!raw.ok)throw new Error("raw "+raw.status);
  return JSON.parse(await raw.text())}
async function ghSave(retry){
  const body={message:"공지·게시판 내용 업데이트",content:b64(JSON.stringify(S))};
  if(sha)body.sha=sha;if(gh.branch)body.branch=gh.branch;
  const r=await fetch(fileUrl(),{method:"PUT",headers:hdr({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  if((r.status===409||r.status===422)&&!retry){await ghLoad();return ghSave(true)}
  if([401,403,404].includes(r.status))throw Object.assign(new Error("auth"),{code:"auth"});
  if(!r.ok)throw new Error("save "+r.status);
  sha=(await r.json()).content.sha}

/* ---------- 저장 ---------- */
let st,q=Promise.resolve();
function save(){
  if(!admin||!gh){msg("관리자로 로그인해야 저장할 수 있어요.");return}
  clearTimeout(st);st=setTimeout(()=>{q=q.then(async()=>{
    try{msg("저장 중…");await ghSave();ss();msg("저장했어요. 방문자 화면에는 1~2분 뒤 반영돼요.")}
    catch(e){msg(e.code==="auth"?"저장 권한이 없어요. 토큰 권한(Contents: Read and write)을 확인하고 다시 로그인해 주세요.":"저장하지 못했어요. 잠시 후 다시 시도해 주세요.")}})},500)}
async function login(){
  const g=guessRepo();let p={owner:g.owner,repo:g.repo,branch:"",token:"",keep:false};
  for(;;){
    const v=await form("관리자 로그인",[
      {t:"msg",v:"GitHub에서 이 저장소 전용 토큰(Fine-grained token, 권한: Contents → Read and write)을 만들어 붙여넣어 주세요. 저장소에 쓰기 권한이 있는 본인만 로그인할 수 있어요."},
      {k:"owner",l:"GitHub 아이디",t:"text",v:p.owner,req:1},
      {k:"repo",l:"저장소 이름",t:"text",v:p.repo,req:1},

    }catch(e){msg("GitHub에 연결하지 못했어요.")}}}

async function shrink(file,max){
  const b=await createImageBitmap(file),k=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement("canvas");
  c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",.82)}
function form(title,fs,ok="저장"){return new Promise(res=>{
  const d=$("#fm"),f=$("#fmF");
  f.innerHTML=`<h2>${title}</h2>`+fs.map((x,i)=>x.t==="msg"?`<p>${esc(x.v)}</p>`:x.t==="check"?`<label class="ck"><input type="checkbox" id="f${i}" ${x.v?"checked":""}> ${x.l}</label>`:`<label>${x.l}${x.t==="area"?`<textarea id="f${i}" rows="5" maxlength="2000">${esc(x.v)}</textarea>`:x.t==="select"?`<select id="f${i}">${x.o.map(o=>`<option value="${esc(o[0])}"${o[0]===x.v?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`:x.t==="file"?`<input id="f${i}" type="file" accept="image/*">`:`<input id="f${i}" type="${x.t}" value="${esc(x.v)}" maxlength="${x.t==="password"?300:80}" autocomplete="off">`}</label>`).join("")+`<div class="acts"><button type="button" class="btn" id="fX">취소</button><button type="button" class="btn ${ok==="삭제"?"dng":"pri"}" id="fOk">${ok}</button></div>`;
  d.onclose=()=>res(null);
  $("#fX").onclick=()=>d.close();
  $("#fOk").onclick=async()=>{const o={};
    for(let i=0;i<fs.length;i++){const x=fs[i],e=$("#f"+i);if(x.t==="msg")continue;
      if(x.t==="file")o[x.k]=e.files[0]?await shrink(e.files[0],960):null;
      else if(x.t==="check")o[x.k]=e.checked;
      else{o[x.k]=e.value.trim();if(x.req&&!o[x.k]){e.focus();return}}}
    res(o);d.close()};
  d.showModal()})}

function cleanTabs(a){
  const seen=new Set(),out=[];
  for(const t of Array.isArray(a)?a:[]){
    if(!t||typeof t!=="object"||!ID_RE.test(t.id)||seen.has(t.id))continue;seen.add(t.id);
    const b=Object.hasOwn(BT,t.id);
    out.push(b?{id:t.id,name:cs(t.name,30)||"탭",type:BT[t.id]}:{id:t.id,name:cs(t.name,30)||"탭",type:"page",body:cs(t.body,2000)});
  }
  for(const d of seed().tabs)if(!seen.has(d.id))out.push(d);   // 빠진 기본 탭은 복구
  return out}
function fixTabs(){S.tabs=cleanTabs(S.tabs)}

/* ================= '프로필 백업' 탭 ================= */
const PKEYS=["name","role","bio","loc","tool","mail","ask"];                 // 백업 대상 글자 항목
const IMG_RE=/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/;     // 사진은 이 형식만 허용 (악성 코드 방지)
const ID_RE=/^[\w-]{1,40}$/;                                                  // id는 영문·숫자·_·- 만 허용
const cs=(v,n)=>typeof v==="string"?v.slice(0,n):"";                         // 문자열만 통과, 길이 제한

/* 백업 파일의 프로필을 안전한 값만 남기고 정리 */
function cleanProfile(p){
  const o={};
  for(const k of PKEYS)o[k]=cs(p[k],k==="bio"?2000:200);
  o.avatar=typeof p.avatar==="string"&&IMG_RE.test(p.avatar)?p.avatar:null;
  return o;
}
/* 백업 파일의 공지·작품·분류를 안전한 값만 남기고 정리 (잘못된 항목은 버림) */
function cleanAll(d){
  const arr=a=>Array.isArray(a)?a.filter(x=>x&&typeof x==="object"&&ID_RE.test(x.id)):[];
  const cats=arr(d.cats).map(c=>({id:c.id,name:cs(c.name,80)||"분류"}));
  if(!cats.length)return null;                                               // 분류가 없으면 게시판이 깨지므로 복원하지 않음
  const ids=new Set(cats.map(c=>c.id));
  return{
    cats,
    ...(Array.isArray(d.tabs)?{tabs:cleanTabs(d.tabs)}:{}),
    works:arr(d.works).map(w=>({id:w.id,title:cs(w.title,80),cat:ids.has(w.cat)?w.cat:cats[0].id,date:cs(w.date,10),desc:cs(w.desc,2000),hue:Number(w.hue)||0,img:typeof w.img==="string"&&IMG_RE.test(w.img)?w.img:null})),
    notices:arr(d.notices).map(n=>({id:n.id,pin:!!n.pin,title:cs(n.title,80),date:cs(n.date,10),body:cs(n.body,2000)}))
  };
}

$("#bkDl").onclick=()=>{

  msg("백업 파일을 내려받았어요.");
};

/* [복원] 버튼 → 파일 선택창 열기 */
$("#bkUp").onclick=()=>$("#bkFile").click();

/* 파일 선택 후: 검사 → 확인 창 → 적용 → GitHub에 저장 */
$("#bkFile").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";                              // 같은 파일을 다시 고를 수 있게 초기화
  if(!f||!admin)return;
  if(f.size>10*1024*1024){msg("파일이 너무 커요. (최대 10MB)");return}
  let d;try{d=JSON.parse(await f.text())}catch(x){msg("백업 파일을 읽을 수 없어요.");return}
  if(!d||d.type!=="profile-backup"||!d.profile||typeof d.profile!=="object"){msg("프로필 백업 파일이 아니에요.");return}
  const hasAll=Array.isArray(d.cats)&&Array.isArray(d.works)&&Array.isArray(d.notices);
  const fs=[{t:"msg",v:`${d.savedAt?d.savedAt.slice(0,10)+" 백업으로 ":""}현재 프로필을 되돌려요. 계속할까요?`}];
  if(hasAll)fs.push({k:"all",t:"check",l:"공지·작품·분류도 함께 복원 (현재 내용은 사라져요)"});
  const v=await form("백업에서 복원",fs,"복원");
  if(!v)return;
  Object.assign(S.profile,cleanProfile(d.profile));                         // 프로필 복원
  if(v.all){const c=cleanAll(d);if(c)Object.assign(S,c);else msg("분류 정보가 없어 공지·작품은 복원하지 않았어요.")}
  cat="all";commit();                                                        // 화면 갱신 + GitHub 저장
};

renderAll();
(async()=>{
  /* 방문자 화면: 저장소의 data.json 을 불러옵니다 (없으면 기본 내용) */
  try{const r=await fetch(DATA_PATH+"?t="+Date.now(),{cache:"no-store"});if(r.ok)applyData(await r.json())}catch(e){}
  renderAll();
  /* 저장된 로그인이 있으면 자동으로 관리자 복구 */
  const c=cfgGet();
  if(c){try{if(await verify(c)){gh=c;admin=true;const d=await ghLoad();if(d)applyData(d)}else cfgClear()}catch(e){}}
  if(!admin)edit=false;
  renderAll();
})();
</script>
</body>
</html>
